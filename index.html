<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizlish – Daily Grammar Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1b2433;--mut:#64708a;--pri:#3b5bdb;--ok:#2b9348;--bad:#d62839;--bd:#e1e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ecf5;--mut:#98a2bb;--pri:#7c93ff;--ok:#4cc26b;--bad:#ff6b7a;--bd:#2c3348}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--tx:#e8ecf5;--mut:#98a2bb;--pri:#7c93ff;--ok:#4cc26b;--bad:#ff6b7a;--bd:#2c3348}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 8% 6%,rgba(255,184,48,.38),transparent 38%),radial-gradient(circle at 95% 12%,rgba(25,211,230,.34),transparent 40%),radial-gradient(circle at 50% 100%,rgba(232,62,140,.30),transparent 45%),radial-gradient(color-mix(in srgb,var(--tx) 16%,transparent) 1.3px,transparent 1.6px) 0 0/22px 22px,var(--bg);background-attachment:fixed;color:var(--tx);font-family:Inter,"Noto Naskh Arabic",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
body.rtl{font-family:"Noto Naskh Arabic",Inter,serif;line-height:1.8}
.wrap{width:100%;max-width:560px}
.sr{position:absolute;left:-9999px}.logo{display:block;width:150px;height:150px;border-radius:30px;margin:0 auto 10px;box-shadow:0 10px 30px rgba(232,62,140,.35)}
h1{margin:0 0 4px;font-size:1.9rem;color:var(--pri);text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.card{background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(6px);box-shadow:0 12px 32px rgba(20,30,70,.15);border:1px solid var(--bd);border-radius:16px;padding:22px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.langs button{flex:1 1 45%;padding:12px 6px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit}
.langs button.on{border-color:var(--pri);background:var(--pri);color:#fff}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem;margin-bottom:14px;font-family:inherit}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut)}
.timer{font-weight:700;font-size:1.2rem;color:var(--tx)}.timer.low{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:100%;background:var(--pri);transition:width 1s linear}
.q{font-size:1.3rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:start;padding:13px 14px;margin-bottom:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}
.score{text-align:center;font-size:3rem;font-weight:700;color:var(--pri);margin:6px 0}
.msg{text-align:center;color:var(--mut);margin-bottom:16px}
.rev{border-top:1px solid var(--bd);padding:12px 0}
.rev b{display:block;margin-bottom:4px}
.g{color:var(--ok)}.r{color:var(--bad)}
.hide{display:none}.lnk{background:none;border:0;color:var(--mut);margin-top:12px;cursor:pointer;width:100%;font-family:inherit}.aqi{display:grid;gap:6px;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}.aqi input{margin:0}.mini{justify-self:end;border:0;background:var(--bg);color:var(--bad);border-radius:8px;padding:6px 10px;cursor:pointer}.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}.btn.alt{background:var(--mut)}.lbr{display:flex;gap:10px;padding:8px 10px;border-radius:10px}.lbr.me{background:color-mix(in srgb,var(--pri) 18%,transparent);font-weight:700}.lbr span:nth-child(2){flex:1}.lbr span:first-child{width:1.6em;color:var(--mut)}h3{margin:18px 0 6px;text-align:center}.rt{font-family:"Noto Naskh Arabic",serif;line-height:1.8}
</style>
</head>

const T={
en:{n:"English",dir:"ltr",sub:"Daily grammar quiz · 10 questions · 45 seconds each",ph:"Your name (optional)",go:"Start today’s quiz",q:"Question",res:"Your result",lb:"Leaderboard",guest:"Guest",you:"you",nolb:"No scores yet",again:"Back to start",tip:["Keep practising!","Good job!","Excellent!"],ok:"Correct answer",your:"Your answer",none:"No answer (time up)",come:"A new quiz arrives tomorrow."},
ur:{n:"اردو",dir:"rtl",sub:"روزانہ گرامر کوئز · 10 سوالات · ہر سوال 45 سیکنڈ",ph:"آپ کا نام (اختیاری)",go:"آج کا کوئز شروع کریں",q:"سوال",res:"آپ کا نتیجہ",lb:"لیڈر بورڈ (آج)",guest:"مہمان",you:"آپ",nolb:"ابھی کوئی اسکور نہیں",again:"شروع میں واپس",tip:["مزید مشق کریں!","شاباش!","بہت خوب!"],ok:"درست جواب",your:"آپ کا جواب",none:"کوئی جواب نہیں (وقت ختم)",come:"کل نیا کوئز آئے گا۔"},
ar:{n:"العربية",dir:"rtl",sub:"اختبار قواعد يومي · 10 أسئلة · 45 ثانية لكل سؤال",ph:"اسمك (اختياري)",go:"ابدأ اختبار اليوم",q:"السؤال",res:"نتيجتك",lb:"لوحة المتصدرين (اليوم)",guest:"ضيف",you:"أنت",nolb:"لا توجد نتائج بعد",again:"العودة للبداية",tip:["واصل التدرّب!","أحسنت!","ممتاز!"],ok:"الإجابة الصحيحة",your:"إجابتك",none:"بلا إجابة (انتهى الوقت)",come:"اختبار جديد غدًا."}
};
T.all={...T.en,n:"All languages · سب · الكل",sub:"Daily grammar quiz · 30 mixed questions (English, اردو, العربية) · 45 seconds each"};
const $=id=>document.getElementById(id);
let L="en",S,list,i,score,log,tick,left,locked;
let NUM=30,SEC=45;

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){arr=arr.slice();for(let k=arr.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[arr[k],arr[j]]=[arr[j],arr[k]]}return arr}
const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function show(id){["pStart","pQuiz","pRes","pLogin","pAdmin"].forEach(p=>$(p).classList.toggle("hide",p!==id))}

function setLang(l){
  L=l;const t=T[l];
  document.documentElement.lang=l;document.documentElement.dir=t.dir;
  document.body.classList.toggle("rtl",t.dir==="rtl");
  $("sub").textContent=t.sub.replace("45",SEC);$("name").placeholder=t.ph;$("go").textContent=t.go;$("again").textContent=t.again;
  $("langs").innerHTML="";
  Object.keys(T).forEach(k=>{const b=document.createElement("button");b.textContent=T[k].n;b.className=k===l?"on":"";b.onclick=()=>setLang(k);$("langs").appendChild(b)});
}

function start(){
  const d=new Date(),day=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  const name=$("name").value.trim().toLowerCase();
  const r=rng(hash(day+"|"+name+"|"+L));   // changes every day and per user
  list=shuffle((L==="all"?Object.keys(Q):[L]).flatMap(k=>Q[k].map(q=>({k,q}))),r).slice(0,NUM).map(({k,q})=>({k,q:q[0],a:q[1],o:shuffle(q.slice(1),r)}));
  i=0;score=0;log=[];show("pQuiz");next();
}

function next(){
  if(i>=list.length)return finish();
  const q=list[i];locked=false;left=SEC;
  $("cnt").textContent=T[L].q+" "+(i+1)+" / "+list.length;
  const rtl=T[q.k].dir==="rtl";$("qt").dir=$("opts").dir=T[q.k].dir;$("qt").className="q"+(rtl?" rt":"");$("opts").className=rtl?"rt":"";
  $("qt").textContent=q.q;$("opts").innerHTML="";
  q.o.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>pick(o,b);$("opts").appendChild(b)});
  const f=$("fill");f.style.transition="none";f.style.width="100%";void f.offsetWidth;f.style.transition="width 1s linear";
  paint();clearInterval(tick);
  tick=setInterval(()=>{left--;paint();if(left<=0)pick(null)},1000);
}
function paint(){$("tm").textContent=left+"s";$("tm").classList.toggle("low",left<=10);$("fill").style.width=(left/SEC*100)+"%"}

function pick(o,btn){
  if(locked)return;locked=true;clearInterval(tick);
  const q=list[i];if(o===q.a)score++;
  log.push({k:q.k,q:q.q,a:q.a,u:o});
  [...$("opts").children].forEach(b=>{if(b.textContent===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
  setTimeout(()=>{i++;next()},900);
}

function finish(){
  const t=T[L];show("pRes");
  $("rt").textContent=t.res;$("sc").textContent=score+" / "+list.length;
  $("rm").textContent=t.tip[score>=list.length?2:score>=list.length/2?1:0]+" "+t.come;
  $("rev").innerHTML=log.map((x,n)=>`<div class="rev" dir="${T[x.k].dir}"><b>${n+1}. ${esc(x.q)}</b>
    <span class="${x.u===x.a?"g":"r"}">${t.your}: ${esc(x.u??t.none)}</span><br>
    ${x.u===x.a?"":`<span class="g">${t.ok}: ${esc(x.a)}</span>`}</div>`).join("");
  window.scrollTo(0,0);saveScore();
}


const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function saveScore(){
  const t=T[L],row={name:$("name").value.trim().slice(0,30)||t.guest,score,total:list.length,mode:L,day:dayKey(),t:Date.now()};
  let rows=null;
  $("lbt").textContent="🏆 "+t.lb+" · "+t.n;$("lb").textContent="…";
  if(!rows){try{const k="ql_"+row.day;const a=JSON.parse(localStorage.getItem(k)||"[]");a.push(row);localStorage.setItem(k,JSON.stringify(a));rows=a.filter(r=>r.mode===L)}catch(e){rows=[row]}}
  rows.sort((a,b)=>b.score-a.score||a.t-b.t);
  const box=$("lb");box.textContent="";
  rows.slice(0,10).forEach((r,n)=>{const d=document.createElement("div");d.className="lbr"+(r.t===row.t&&r.name===row.name?" me":"");
    [n+1,r.name+(d.className.includes("me")?" ("+t.you+")":""),r.score+"/"+r.total].forEach(x=>{const sp=document.createElement("span");sp.textContent=x;d.appendChild(sp)});box.appendChild(d)});
}


const AH=2352646237;let AL="en";
function applyCfg(c){try{if(c.Q&&c.Q.en&&c.Q.ur&&c.Q.ar)Q=c.Q;if(c.SEC>=10)SEC=c.SEC}catch(e){}}
try{const c=JSON.parse(localStorage.getItem("ql_cfg")||"null");if(c)applyCfg(c)}catch(e){}
function adminRender(){
  const box=$("aq");box.textContent="";
  Q[AL].forEach((q,n)=>{while(q.length<5)q.push("");
    const d=document.createElement("div");d.className="aqi";d.dir=T[AL].dir;
    ["Question","Correct answer","Wrong answer 1","Wrong answer 2","Wrong answer 3"].forEach((ph,j)=>{const i=document.createElement("input");i.value=q[j];i.placeholder=ph;i.oninput=()=>{q[j]=i.value};d.appendChild(i)});
    const x=document.createElement("button");x.className="mini";x.textContent="🗑 Delete";x.onclick=()=>{Q[AL].splice(n,1);adminRender()};d.appendChild(x);box.appendChild(d)});
  $("asec").value=SEC;
}
function saveCfg(){
  for(const k of Object.keys(Q))Q[k]=Q[k].map(q=>[(q[0]||"").trim(),(q[1]||"").trim(),...q.slice(2).map(v=>(v||"").trim()).filter(Boolean)]).filter(q=>q[0]&&q[1]&&q.length>=3);
  SEC=Math.min(300,Math.max(10,+$("asec").value||45));
  const c={Q,SEC};try{localStorage.setItem("ql_cfg",JSON.stringify(c))}catch(e){}
  $("amsg").textContent="Saved on this device ✔";adminRender();setLang(L);
}
function leaveAdmin(){$("apw").value="";$("aerr").textContent="";show("pStart")}
$("adm").onclick=()=>{show("pLogin");$("apw").focus()};
$("alogin").onclick=()=>{if(hash($("apw").value.trim())===AH){$("aerr").textContent="";$("amsg").textContent="";show("pAdmin");adminRender()}else $("aerr").textContent="Wrong password"};
$("apw").onkeydown=e=>{if(e.key==="Enter")$("alogin").click()};
$("alang").onchange=e=>{AL=e.target.value;adminRender()};
$("aadd").onclick=()=>{Q[AL].push(["","","","",""]);adminRender()};
$("asave").onclick=saveCfg;$("aexit").onclick=$("aback1").onclick=leaveAdmin;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(!$("pLogin").classList.contains("hide")||!$("pAdmin").classList.contains("hide")))leaveAdmin()});
$("go").onclick=start;
$("again").onclick=()=>show("pStart");
setLang("en");
</script>
