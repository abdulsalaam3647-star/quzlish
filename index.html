<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizlish – Daily Grammar Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1b2433;--mut:#64708a;--pri:#3b5bdb;--ok:#2b9348;--bad:#d62839;--bd:#e1e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ecf5;--mut:#98a2bb;--pri:#7c93ff;--ok:#4cc26b;--bad:#ff6b7a;--bd:#2c3348}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--tx:#e8ecf5;--mut:#98a2bb;--pri:#7c93ff;--ok:#4cc26b;--bad:#ff6b7a;--bd:#2c3348}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% 15%,#2a1b6b 0,transparent 55%),radial-gradient(ellipse at 85% 80%,#0f4c75 0,transparent 55%),radial-gradient(ellipse at 60% 40%,#4b2a86 0,transparent 50%),#070a22;background-attachment:fixed;color:var(--tx);font-family:Inter,"Noto Naskh Arabic",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
body.rtl{font-family:"Noto Naskh Arabic",Inter,serif;line-height:1.8}
.wrap{width:100%;max-width:560px}
.sr{position:absolute;left:-9999px}.logo{display:block;width:150px;height:150px;border-radius:30px;margin:0 auto 10px;box-shadow:0 10px 30px rgba(232,62,140,.35)}
h1{margin:0 0 4px;font-size:1.9rem;color:var(--pri);text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.card{background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(6px);box-shadow:0 12px 32px rgba(20,30,70,.15);border:1px solid var(--bd);border-radius:16px;padding:22px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.langs button{flex:1 1 45%;padding:12px 6px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit}
.langs button.on{border-color:var(--pri);background:var(--pri);color:#fff}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem;margin-bottom:14px;font-family:inherit}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut)}
.timer{font-weight:700;font-size:1.2rem;color:var(--tx)}.timer.low{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:100%;background:var(--pri);transition:width 1s linear}
.q{font-size:1.3rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:start;padding:13px 14px;margin-bottom:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}
.score{text-align:center;font-size:3rem;font-weight:700;color:var(--pri);margin:6px 0}
.msg{text-align:center;color:var(--mut);margin-bottom:16px}
.rev{border-top:1px solid var(--bd);padding:12px 0}
.rev b{display:block;margin-bottom:4px}
.g{color:var(--ok)}.r{color:var(--bad)}
.hide{display:none}#float{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}#float i{position:absolute;opacity:.7;filter:blur(80px);width:45vmax!important;height:45vmax!important;will-change:transform;animation:fl 18s ease-in-out infinite}#float i:nth-child(1){width:240px;height:240px;left:4%;top:8%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd166,#ff8a00)}#float i:nth-child(2){width:180px;height:180px;right:6%;top:14%;border-radius:38%;background:linear-gradient(135deg,#19d3e6,#3b5bdb);animation-duration:22s}#float i:nth-child(3){width:260px;height:260px;left:60%;bottom:6%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff7eb6,#e83e8c);animation-duration:20s}#float i:nth-child(4){width:150px;height:150px;left:10%;bottom:10%;border-radius:30%;background:linear-gradient(135deg,#7bed9f,#1dd1a1);animation-duration:25s}#float i:nth-child(5){width:120px;height:120px;left:42%;top:42%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#b794f4,#6c5ce7);animation-duration:17s}#float b{position:absolute;bottom:-80px;font:700 3rem serif;color:#fff;opacity:.35;animation:rise 16s linear infinite}#float b:nth-of-type(1){left:12%}#float b:nth-of-type(2){left:34%;animation-delay:4s;animation-duration:20s}#float b:nth-of-type(3){left:68%;animation-delay:8s}#float b:nth-of-type(4){left:88%;animation-delay:2s;animation-duration:22s}@keyframes fl{0%,100%{transform:translate(0,0) scale(1) rotate(0)}33%{transform:translate(40px,-60px) scale(1.15) rotate(40deg)}66%{transform:translate(-50px,40px) scale(.9) rotate(-30deg)}}@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}@media(prefers-reduced-motion:reduce){#float *{animation:none!important}}.btn,.opt,.langs button,.lnk,.pad button,.mini{transition:transform .15s,box-shadow .15s,filter .15s,background .15s,border-color .15s,color .15s}.btn:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 50%,transparent)}.btn.alt:hover{background:var(--pri)}.opt:not(.ok):not(.bad):hover{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 18%,var(--bg));transform:translateX(4px);box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 35%,transparent)}.menu .opt:not(.ok):not(.bad):hover{transform:translateY(-3px) scale(1.04)}.langs button:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 35%,transparent)}.lnk:hover{color:var(--pri);text-decoration:underline}.pad button:hover{background:var(--pri);color:#fff;transform:scale(1.06)}.mini:hover{background:var(--bad);color:#fff}td.c:hover,.sc:hover,.su div:hover{background:color-mix(in srgb,var(--pri) 30%,transparent)}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}.qn{margin-bottom:14px}.qn label{display:block;margin-bottom:6px;color:var(--mut)}input[type=range]{padding:0;border:0;background:none;accent-color:var(--pri);margin-bottom:0}.lbr span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}.arw{display:grid;grid-template-columns:1fr 1.4fr .7fr .6fr .9fr auto;gap:6px;font-size:.82rem;padding:6px 0;border-bottom:1px solid var(--bd)}.arw span{overflow-wrap:anywhere}.arw.h{font-weight:700;color:var(--mut)}#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#10163f,#000 70%);animation:fo .6s 2.7s forwards}#splash img{width:200px;height:200px;border-radius:40px;animation:pop 1.6s cubic-bezier(.2,1.3,.4,1) both,glow 1.2s 1.6s ease-in-out infinite alternate}#splash p{color:#fff;font:700 1.3rem Inter,sans-serif;letter-spacing:7px;margin-top:24px;animation:up 1s .9s both}@keyframes pop{0%{transform:scale(.55) rotate(-200deg);opacity:1}70%{transform:scale(1.12) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}@keyframes glow{to{box-shadow:0 0 60px 10px rgba(25,211,230,.55),0 0 90px 20px rgba(232,62,140,.35)}}@keyframes up{from{opacity:0;transform:translateY(20px)}}@keyframes fo{to{opacity:0;visibility:hidden}}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu .opt{margin:0;text-align:center;font-weight:600}table{border-collapse:collapse;margin:auto}td.c{width:var(--cs);height:var(--cs);border:1px solid var(--bd);padding:0;cursor:pointer;text-align:center;font-size:calc(var(--cs)*.6)}td.f{background:var(--pri)}td.x::after{content:"✕";color:var(--mut)}td.k{font-size:11px;color:var(--mut);text-align:center;vertical-align:bottom;padding:1px 3px;line-height:1.1}.r5{border-right-color:var(--mut)!important}.b5{border-bottom-color:var(--mut)!important}.sg{display:grid;margin:auto;width:max-content;touch-action:none;user-select:none;border:2px solid var(--tx)}.sc{height:var(--cs);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cs)*.5)}.su{display:grid;grid-template-columns:repeat(9,1fr);margin:auto;max-width:400px;border:2px solid var(--tx)}.su div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);font-size:1.2rem;cursor:pointer}.su .g{font-weight:700}.su .sel{background:color-mix(in srgb,var(--pri) 30%,transparent)}.su .bad{color:var(--bad)}.su div:nth-child(3n){border-right:2px solid var(--tx)}.su div:nth-child(9n){border-right:0}.su div:nth-child(n+19):nth-child(-n+27),.su div:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--tx)}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.pad button{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1.1rem;cursor:pointer}.lnk{background:none;border:0;color:var(--mut);margin-top:12px;cursor:pointer;width:100%;font-family:inherit}.aqi{display:grid;gap:6px;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}.aqi input{margin:0}.mini{justify-self:end;border:0;background:var(--bg);color:var(--bad);border-radius:8px;padding:6px 10px;cursor:pointer}.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}.btn.alt{background:var(--mut)}.lbr{display:flex;gap:10px;padding:8px 10px;border-radius:10px}.lbr.me{background:color-mix(in srgb,var(--pri) 18%,transparent);font-weight:700}.lbr span:nth-child(2){flex:1}.lbr span:first-child{width:1.6em;color:var(--mut)}h3{margin:18px 0 6px;text-align:center}.rt{font-family:"Noto Naskh Arabic",serif;line-height:1.8}
</style>
</head>

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){arr=arr.slice();for(let k=arr.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[arr[k],arr[j]]=[arr[j],arr[k]]}return arr}

async function start(){await loadQ();

function next(){
  if(i>=list.length)return finish();
  const q=list[i];locked=false;left=SEC;
  $("cnt").textContent=T[L].q+" "+(i+1)+" / "+list.length;
  const rtl=T[q.k].dir==="rtl";$("qt").dir=$("opts").dir=T[q.k].dir;$("qt").className="q"+(rtl?" rt":"");$("opts").className=rtl?"rt":"";
  $("qt").textContent=q.q;$("opts").innerHTML="";
  q.o.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>pick(o,b);$("opts").appendChild(b)});
  const f=$("fill");f.style.transition="none";f.style.width="100%";void f.offsetWidth;f.style.transition="width 1s linear";
  paint();clearInterval(tick);
  tick=setInterval(()=>{left--;paint();if(left<=0)pick(null)},1000);
}
function paint(){$("tm").textContent=left+"s";$("tm").classList.toggle("low",left<=10);$("fill").style.width=(left/SEC*100)+"%"}

function pick(o,btn,sk){
  if(locked)return;locked=true;clearInterval(tick);
  const q=list[i];if(o===q.a)score++;
  log.push({k:q.k,q:q.q,a:q.a,u:o,s:sk});
  [...$("opts").children].forEach(b=>{if(b.textContent===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
  const id=QID;setTimeout(()=>{if(id===QID){i++;next()}},900);
}

function finish(){TOTAL=list.length;USED=Math.round((Date.now()-QS)/1000);
  const t=T[L];show("pRes");
  $("rt").textContent=t.res;$("sc").textContent=score+" / "+list.length;
  $("rm").textContent=t.tip[score>=list.length?2:score>=list.length/2?1:0]+" "+t.come;
  $("rev").innerHTML=log.map((x,n)=>`<div class="rev" dir="${T[x.k].dir}"><b>${n+1}. ${x.q}</b>
    <span class="${x.u===x.a?"g":"r"}">${t.your}: ${x.s?"⏭ Skipped":(x.u??t.none)}</span><br>
    ${x.u===x.a?"":`<span class="g">${t.ok}: ${x.a}</span>`}</div>`).join("");
  window.scrollTo(0,0);saveScore();
}
